# Visible-skip check for the `niwa watch` live egress gate.
#
# The egress gate is local-only. TestResumedSessionDeniesEgress_OnHarness
# (internal/cli) drives real authenticated Claude Code sessions under the OS
# no-egress sandbox: it stages a review through the production launch, stops
# it, runs the pre-wake gate, wakes it with no flags, checks the wake kept the
# session id and started no copy, checks a raw TCP connect from the woken
# session is denied, wakes it a second time, and runs the
# stanza_written_after_settle and pr_clone_settings_not_loaded subtests. CI has
# no API key for those sessions and no disposable host for them, so the test
# skips in CI on purpose (it detects CI before reading its opt-ins, so setting
# the opt-ins here would not run it either).
#
# Re-run the gate locally, on a disposable host, for each Claude Code upgrade
# used with `niwa watch`. The continuation relies on Claude Code continuing a
# stopped background session under its own id on a flagless resume and on the
# options it saves with the job; both can change between releases:
#
#   NIWA_WATCH_LIVE_TEST=1 NIWA_WATCH_LIVE_TEST_DISPOSABLE_HOST=1 \
#   NIWA_WATCH_LIVE_REPORT=/tmp/watch-live-report.txt \
#     go test ./internal/cli/ -count=1 -v \
#       -run '^TestResumedSessionDeniesEgress_OnHarness$' -timeout 30m
#
# The report file records the Claude Code version, the flags the job saved for
# the review stage (the --settings value reduced to its key list), whether
# claude.ai still reaches the woken session, and each subtest's pass. The
# fresh-stage test in internal/watch (TestContainedSessionDeniesEgress_OnHarness)
# takes the same opt-ins.
#
# What this workflow checks, with no secret and no opt-in variables: the gate
# reports `--- SKIP` with its local-only reason rather than passing silently,
# and the offline tests for its copy check and its skip decision pass.

name: Watch live egress gate

# It runs on pull requests that touch the watch code, the gate's test file or
# this workflow, because those are the changes that could make the gate run,
# fail or pass silently in CI. It takes seconds, so it costs little there.
# workflow_dispatch stays for a manual check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/watch/**'
      - 'internal/cli/watch*'
      - '.github/workflows/watch-live-egress.yml'

permissions:
  contents: read

jobs:
  live-egress:
    name: Live egress gate skips visibly in CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Run the live gate and its offline tests
        # No opt-in variables: GitHub Actions sets GITHUB_ACTIONS=true, so the
        # live gate skips with its local-only reason.
        run: |
          set -o pipefail
          go test ./internal/cli/ -count=1 -v -timeout 10m \
            -run '^(TestResumedSessionDeniesEgress_OnHarness|TestLiveGateCopyCheck|TestLiveGateRunDecision)$' \
            2>&1 | tee "$RUNNER_TEMP/watch-live-gate.log"

      - name: Check the gate skipped visibly and the offline tests passed
        if: ${{ !cancelled() }}
        run: |
          log="$RUNNER_TEMP/watch-live-gate.log"
          gate=TestResumedSessionDeniesEgress_OnHarness
          fail=0
          if [ ! -s "$log" ]; then
            echo "::error::the test output is missing"
            exit 1
          fi
          if ! grep -qE -- "^--- SKIP: $gate \(" "$log"; then
            echo "::error::$gate didn't report SKIP; in CI it must skip visibly"
            fail=1
          fi
          if ! grep -qF -- "live egress gate is local-only, skipped in CI" "$log"; then
            echo "::error::$gate's skip doesn't carry the local-only reason"
            fail=1
          fi
          for name in TestLiveGateCopyCheck TestLiveGateRunDecision; do
            if ! grep -qE -- "^--- PASS: $name \(" "$log"; then
              echo "::error::no PASS line for $name"
              fail=1
            fi
          done
          {
            echo "### Watch live egress gate"
            echo
            echo "The egress gate is local-only and skipped in CI. Re-run it locally for each Claude Code upgrade used with niwa watch (see this workflow's header)."
            echo
            echo '```'
            grep -E -- "^--- (SKIP|PASS|FAIL): " "$log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
