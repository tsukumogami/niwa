name: Authority

# The authority tests, on every pull request with no path filter. The
# gate-contract scenarios read their reference checks from
# docs/guides/authority-grants.md, so a change to that guide alone has to run
# them; the Tests workflow skips a docs-only change. The job also proves the
# feature needs no koto: it fails before running anything if a koto binary
# resolves on PATH.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository; see the Tests workflow for why the
# token stays read-only and the checkout keeps no credentials.
permissions:
  contents: read

jobs:
  authority:
    name: Authority tests without koto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Fail if koto is on PATH
        run: |
          if command -v koto >/dev/null 2>&1; then
            echo "::error::koto resolves on PATH at $(command -v koto); the authority tests must run without it"
            exit 1
          fi
          echo "OK: no koto on PATH"

      # The reference checks parse niwa's output with jq, and the scenarios
      # link it into the stub gate's PATH.
      - name: Check jq is available
        run: jq --version

      - name: Authority unit and functional tests
        run: make test-authority
